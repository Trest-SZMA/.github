# Ветка задачи по регламенту Trest-SZMA (CONTRIBUTING.md, раздел 3, шаг 2).
# Когда issue назначают на исполнителя, создаёт ветку <№>-<заголовок транслитом> от Development,
# привязывает её к issue и пишет в issue, как её забрать.
# Вызывается из репозиториев workflow-ом vetka-zadachi.yml (образец — workflows/vyzov-vetka.yml).
name: vetka-zadachi

on:
  workflow_call:

jobs:
  branch:
    name: Ветка задачи
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const n = issue.number;
            if (issue.pull_request || issue.state !== 'open') return core.info('Не открытая issue — пропуск.');

            // Ветка у задачи уже есть — своя (n-…) или привязанная к issue
            const own = await github.rest.git.listMatchingRefs({ owner, repo, ref: `heads/${n}-` });
            if (own.data.length) return core.info(`Ветка уже есть: ${own.data[0].ref}`);
            const linked = await github.graphql(
              `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){linkedBranches(first:1){nodes{ref{name}}}}}}`,
              { o: owner, r: repo, n });
            if (linked.repository.issue.linkedBranches.nodes.length) return core.info('К issue уже привязана ветка.');

            let dev;
            try { dev = await github.rest.git.getRef({ owner, repo, ref: 'heads/Development' }); }
            catch { return core.info('Ветки Development нет — регламент в репозитории не подключён.'); }

            const map = { а:'a', б:'b', в:'v', г:'g', д:'d', е:'e', ё:'e', ж:'zh', з:'z', и:'i', й:'y', к:'k', л:'l',
              м:'m', н:'n', о:'o', п:'p', р:'r', с:'s', т:'t', у:'u', ф:'f', х:'kh', ц:'ts', ч:'ch', ш:'sh', щ:'shch',
              ъ:'', ы:'y', ь:'', э:'e', ю:'yu', я:'ya' };
            const slug = [...issue.title.toLowerCase()].map(c => map[c] ?? c).join('')
              .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')
              .split('-').filter(Boolean).slice(0, 5).join('-').slice(0, 40).replace(/-+$/, '');
            const name = slug ? `${n}-${slug}` : `${n}-zadacha`;

            // Создать и привязать к issue; если привязка недоступна — просто создать ветку
            try {
              const ids = await github.graphql(
                `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){id issue(number:$n){id}}}`,
                { o: owner, r: repo, n });
              await github.graphql(
                `mutation($i:ID!,$r:ID!,$oid:GitObjectID!,$name:String!){createLinkedBranch(input:{issueId:$i,repositoryId:$r,oid:$oid,name:$name}){linkedBranch{id}}}`,
                { i: ids.repository.issue.id, r: ids.repository.id, oid: dev.data.object.sha, name: `refs/heads/${name}` });
            } catch (e) {
              core.warning(`Привязка не удалась (${e.message}) — создаю ветку без привязки.`);
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${name}`, sha: dev.data.object.sha });
            }

            await github.rest.issues.createComment({ owner, repo, issue_number: n, body: [
              `Ветка задачи создана от \`Development\`: **\`${name}\`**`,
              '',
              `- **VS Code:** Source Control → «…» → Fetch, затем имя ветки внизу слева → \`origin/${name}\`.`,
              `- **Терминал:** \`git fetch\` и \`git switch ${name}\`.`,
              '',
              'Дальше — памятка, шаг 3. Регламент: https://github.com/Trest-SZMA/.github/blob/main/ПАМЯТКА.md',
            ].join('\n') });
            core.info(`Создана ветка ${name}`);
